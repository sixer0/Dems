<!doctype html>
<!--
  DEMS Edge — HDMI kiosk shell (lock screen + auto re-lock).

  Served as a static file from the web console's OWN origin (http://127.0.0.1:5173/kiosk.html), so
  every request below is same-origin: it travels through the console's live-mode dev proxy
  (/api/v1 -> 127.0.0.1:4420, apps/core-web/vite.config.ts WT-1..WT-3) and the Core's Origin guard
  (§2.4, OR-7) sees `http://127.0.0.1:5173` exactly as the browser sent it. Nothing is rewritten.

  Unlock rule set by the principal (PT GSP, 2026-11-02): the operator account `root` only.
  The typed password goes into one request body, is never stored, never logged, never echoed, and
  the field is cleared on every answer (the rule the console holds in its own login tests, AC-50).

  Unlocked state = the console itself, shown in a frameless full-screen iframe on this same HDMI
  output. The session is polled: when the Core stops accepting it (sign-out, session end, expiry,
  or a Core restart) the iframe is removed and the lock comes back within POLL_MS. The iframe is
  dropped on purpose rather than reloaded in place, so no page of the console can keep the old
  session alive in memory.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>DEMS|LOCKED</title>
<style>
  :root {
    --bg: #0b0b12; --fg: #e8e8f0; --dim: #8b8ba3; --line: #26263a;
    --accent: #4f8cff; --bad: #ff5f56; --ok: #16a34a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 16px/1.45 system-ui, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  /* ── lock ─────────────────────────────────────────────────────────────────────── */
  #lock { position: fixed; inset: 0; display: grid; place-items: center; }
  .panel { width: min(420px, 88vw); text-align: center; }
  .mark { display: inline-flex; align-items: center; gap: 12px; }
  .glyph {
    width: 44px; height: 44px; border-radius: 11px;
    background: linear-gradient(150deg, var(--accent), #7b4fff);
    display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 20px;
  }
  .word { font-size: 26px; font-weight: 700; letter-spacing: .14em; }
  .word span { color: var(--accent); }
  .rule { height: 1px; background: var(--line); margin: 26px 0 22px; }
  .state { font-size: 13px; letter-spacing: .34em; color: var(--dim); text-transform: uppercase; }
  .head { font-size: 30px; font-weight: 650; margin: 10px 0 4px; }
  .sub { color: var(--dim); font-size: 14px; margin-bottom: 24px; }
  form { display: grid; gap: 10px; }
  input[type=password] {
    width: 100%; padding: 14px 16px; font-size: 17px; letter-spacing: .1em;
    color: var(--fg); background: #14141f; border: 1px solid var(--line); border-radius: 10px; outline: none;
  }
  input[type=password]:focus { border-color: var(--accent); }
  button {
    padding: 13px 16px; font-size: 16px; font-weight: 600; cursor: pointer;
    color: #fff; background: var(--accent); border: 0; border-radius: 10px;
  }
  button:disabled { opacity: .55; cursor: default; }
  .msg { min-height: 20px; font-size: 14px; color: var(--bad); }
  .msg.ok { color: var(--ok); }
  .foot { margin-top: 26px; font-size: 11px; color: #55556b; letter-spacing: .08em; }
  /* ── unlocked ─────────────────────────────────────────────────────────────────── */
  #desk { position: fixed; inset: 0; display: none; }
  #desk > iframe { width: 100%; height: 100%; border: 0; background: var(--bg); }
  body.open #lock { display: none; }
  body.open #desk { display: block; }
</style>
</head>
<body>
  <main id="lock" class="panel-wrap" role="main">
    <div class="panel">
      <div class="mark">
        <span class="glyph" aria-hidden="true">D</span>
        <span class="word">DEMS<span>EDGE</span></span>
      </div>
      <div class="rule"></div>

      <p class="state" id="state">Locked</p>
      <h1 class="head" id="head">This device is locked</h1>
      <p class="sub">Sign in as <strong>root</strong> to open the console.</p>

      <form id="f" autocomplete="off">
        <input id="pw" type="password" name="password" autocomplete="off" spellcheck="false"
               placeholder="root password" aria-label="root password" autofocus>
        <button id="go" type="submit">Unlock</button>
        <p class="msg" id="msg" role="status" aria-live="polite"></p>
      </form>

      <p class="foot">PT GSP &middot; DEMS Edge bench unit</p>
    </div>
  </main>

  <div id="desk"><iframe id="frame" title="DEMS Edge console" allow="fullscreen"></iframe></div>

<script>
(() => {
  const API = '/api/v1';
  const POLL_MS = 10000;
  const msg = document.getElementById('msg');
  const pw = document.getElementById('pw');
  const go = document.getElementById('go');
  const f = document.getElementById('f');
  const state = document.getElementById('state');
  const head = document.getElementById('head');
  const frame = document.getElementById('frame');

  const say = (t, ok) => { msg.textContent = t || ''; msg.className = 'msg' + (ok ? ' ok' : ''); };
  let timer = null;

  const openDesk = () => {
    document.title = 'DEMS|UNLOCKED';
    if (!document.body.classList.contains('open')) frame.src = '/';
    document.body.classList.add('open');
    if (timer === null) timer = setInterval(checkSession, POLL_MS);
  };

  // Menghilangkan iframe sama sekali, bukan memuat ulang di tempat: halaman konsol yang masih
  // terbuka tidak boleh menahan sesi lama di memori setelah kunci jatuh kembali.
  const closeDesk = (why) => {
    if (!document.body.classList.contains('open')) return;
    document.body.classList.remove('open');
    frame.src = 'about:blank';
    clearInterval(timer); timer = null;
    document.title = 'DEMS|LOCKED';
    state.textContent = 'Locked'; head.textContent = 'This device is locked';
    say(why || '', false); pw.focus();
  };

  async function checkSession() {
    try {
      const r = await fetch(API + '/auth/session', { credentials: 'same-origin', cache: 'no-store' });
      if (r.status === 401) { closeDesk('Session ended — the screen locked again.'); return; }
      if (!r.ok && r.status !== 200) { closeDesk('Cannot reach the Core server — locked.'); return; }
      if (!document.body.classList.contains('open')) openDesk();   // masih hidup dari boot/hibernate
    } catch (e) { closeDesk('Cannot reach the Core server — locked.'); }
  }

  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = pw.value;
    if (!password) { say('Enter the root password.'); pw.focus(); return; }
    go.disabled = true; say('');
    try {
      const res = await fetch(API + '/auth/sign-in', {
        method: 'POST', credentials: 'same-origin', cache: 'no-store',
        headers: { 'content-type': 'application/json' },
        // Username dikunci di sini: aturan prinsipal, hanya `root` yang membuka layar ini.
        body: JSON.stringify({ username: 'root', password }),
      });
      pw.value = '';                                   // nilai yang diketik tidak disimpan di mana pun
      if (res.ok) { openDesk(); return; }
      const body = await res.json().catch(() => ({}));
      const code = body && (body.code || body.error);
      if (code === 'AUTH_LOCKED') { state.textContent = 'Locked out'; head.textContent = 'Too many attempts'; say('This account is temporarily locked. Try again later.'); }
      else if (res.status === 401 || code === 'AUTH_FAILED') say('Wrong password.');
      else say('The Core refused the sign-in' + (code ? ' (' + code + ')' : '') + '.');
    } catch (err) {
      pw.value = '';
      say('Cannot reach the Core server on this device.');
    } finally {
      go.disabled = false; pw.focus();
    }
  });

  document.addEventListener('contextmenu', (e) => e.preventDefault());
  checkSession();   // sesi yang masih terbuka saat kabel dicolok ulang tidak minta login lagi
})();
</script>
</body>
</html>
